[project]
name = "travel-ai-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "WorkiNik",email = "flyrussel@gmail.com"}    
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = {extras = ["email"], version = "^2.13.4"}
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
redis = "^5.0"
python-dotenv = "^1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
openai = "^1.3"
alembic = "^1.13.0"
bcrypt = "^5.0.0"
google-genai = "^2.14.0"
pgvector = "^0.5.0"
slowapi = "^0.1.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
httpx = "^0.28"
black = "^23.11"
ruff = "^0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]