server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: любой путь отдаёт index.html,
    # чтобы React Router сам разобрался с маршрутом на клиенте
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэшируем статику надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}